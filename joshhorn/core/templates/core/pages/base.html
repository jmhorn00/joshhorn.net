{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block meta_description %}{% endblock %}">
  <title>{% block title %}Josh Horn{% endblock %}</title>
  <link rel="icon" href="{% static 'core/imgs/favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'core/dist/css/core.css' %}">
  {% block head %}{% endblock %}
</head>

<body>
  <nav class="navbar" id="siteNav">
    <div class="nav-container">

      <!-- Top row: brand left, toggle right -->
      <div class="nav-bar">
        <a class="brand-link" href="{% url 'core:home' %}">
          <span class="brand-monogram" aria-hidden="true">JH</span>
          <span class="brand-name">Josh<span class="brand-dot">.</span>Horn</span>
        </a>

        <button class="nav-toggle" type="button" aria-controls="navMenu" aria-expanded="false">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
      </div>

      <!-- Collapsible menu (below on mobile, inline on desktop) -->
      <ul class="nav-menu" id="navMenu">
        <li class="nav-item"><a class="nav-link" href="{% url 'core:home' %}#hero"     data-section="hero">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'core:home' %}#about"    data-section="about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'core:home' %}#projects" data-section="projects">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'core:home' %}#services" data-section="services">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'core:home' %}#contact"  data-section="contact">Contact</a></li>
      </ul>

    </div>
  </nav>

  <main id="pageContent">
    {% block content %}
    {% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-copy">&copy; {% now "Y" %} Josh Horn. All rights reserved.</p>
      <nav class="footer-links" aria-label="Footer navigation">
        <a class="footer-link" href="{% url 'core:home' %}#about">About</a>
        <a class="footer-link" href="{% url 'core:home' %}#projects">Projects</a>
        <a class="footer-link" href="{% url 'core:home' %}#services">Services</a>
        <a class="footer-link" href="{% url 'core:home' %}#contact">Contact</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="{% static 'core/dist/js/core.js' %}"></script>
</body>
</html>
